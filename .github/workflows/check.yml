# Runs on every push and pull request: installs, lints, typechecks, runs the
# tests (including the database, in an in-memory Postgres) and builds the site.
# A red X on GitHub means a change broke something.
name: Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
